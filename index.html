<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Birthday Cake 🎂</title>

<style>
body {
  background:rgb(240, 192, 255);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  height:100vh;
  color:white;
  font-family: "Courier New", monospace;
}

/* INPUT */
.input-box {
  margin-bottom: 160px;
}

input, button {
  padding: 8px 12px;
  font-size: 16px;
  border-radius: 10px;
  border: none;
}

button {
  cursor: pointer;
}

/* CAKE */
.cake {
  position: relative;
  width: 220px;
  height: 130px;
  background: #4b2e1f;
  border-radius: 0 0 20px 20px;
  box-shadow: inset 0 -15px #3a2217;
}

/* CAKE LAYERS */
.cake::before {
  content:"";
  position:absolute;
  top:40px;
  left:0;
  width:100%;
  height:10px;
  background:#3a2217;
}

.cake::after {
  content:"";
  position:absolute;
  top:80px;
  left:0;
  width:100%;
  height:10px;
  background:#3a2217;
}

/* FROSTING */
.frosting {
  position:absolute;
  top:-25px;
  left:0;
  width:100%;
  height:40px;
  background:#fff;
  border-radius: 20px 20px 10px 10px;
}

.drip {
  position:absolute;
  width:20px;
  height:30px;
  background:#fff;
  border-radius:0 0 10px 10px;
  top:30px;
}

.drip:nth-child(1){ left:20px; height:25px;}
.drip:nth-child(2){ left:70px; height:35px;}
.drip:nth-child(3){ left:130px; height:28px;}
.drip:nth-child(4){ left:180px; height:32px;}

/* CANDLES */
.candles {
  position:absolute;
  top:-70px;
  width:100%;
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
}

.candle {
  width:8px;
  height:35px;
  background:#d93030;
  margin:4px;
  position:relative;
  border-radius:2px;
}

.flame {
  position:absolute;
  top:-16px;
  left:50%;
  transform:translateX(-50%);
  width:10px;
  height:16px;
  background: radial-gradient(circle, #fff7b2 40%, #ffb300 90%);
  border-radius:50%;
  animation:flicker 0.2s infinite alternate;
}

.input-box {
  margin-bottom: 160px;
  display: flex;
  gap: 10px;
  align-items: center;
}

input {
  width: 200px;
  padding: 8px 12px;
  box-sizing: border-box;
}


@keyframes flicker {
  from { transform:translateX(-50%) scale(1); }
  to { transform:translateX(-50%) scale(1.15); }
}

.hidden { display:none; }
</style>
</head>

<body>

<p style="color: rgb(1, 6, 7);">ХӨӨРХӨН ЧООГИЙ ЭГЧДЭЭ ТӨРСӨН ӨДРИЙН МЭНД ХҮРГЭЕ!💖 хайртай жүү </p>


<div class="input-box">
  <input type="number" id="age" placeholder="Насаа оруулуурай" min="1" max="150">
  <button onclick="createCake()">оруулах</button>
</div>

<div class="cake">
  <div class="frosting">
    <div class="drip"></div>
    <div class="drip"></div>
    <div class="drip"></div>
    <div class="drip"></div>
  </div>
  <div class="candles" id="candles"></div>
</div>

<p style="color:rgb(1, 6, 7);">Лаагаа үлээхээсээ өмнө хүслээ шивнээрэй 💖</p>

<script>
let flames = [];

function createCake() {
  const age = document.getElementById("age").value;
  const candlesBox = document.getElementById("candles");

  candlesBox.innerHTML = "";
  flames = [];

  for (let i = 0; i < age; i++) {
    const candle = document.createElement("div");
    candle.className = "candle";

    const flame = document.createElement("div");
    flame.className = "flame";

    candle.appendChild(flame);
    candlesBox.appendChild(candle);
    flames.push(flame);
  }

  startMic();
}

async function startMic() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const audioContext = new AudioContext();
    const analyser = audioContext.createAnalyser();
    const source = audioContext.createMediaStreamSource(stream);
    source.connect(analyser);

    const data = new Uint8Array(analyser.fftSize);

    function detectBlow() {
      analyser.getByteTimeDomainData(data);
      let max = 0;

      for (let i = 0; i < data.length; i++) {
        const v = Math.abs(data[i] - 128);
        if (v > max) max = v;
      }

      if (max > 30) {
        flames.forEach(f => f.classList.add("hidden"));
      }

      requestAnimationFrame(detectBlow);
    }

    detectBlow();
  } catch {
    alert("Allow microphone to blow the candles 🎤");
  }
}
</script>

</body>
</html>
